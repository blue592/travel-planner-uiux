<script>
function route(){const id=location.hash.slice(1);document.querySelectorAll('main section').forEach(s=>s.hidden=s.id!==(['trip','detail'].includes(id)?id:'home'));window.scrollTo(0,0)}
onhashchange=route;route();
function filterTrips(){let count=0;document.querySelectorAll('.card').forEach(c=>{c.hidden=!c.querySelector('strong').textContent.includes(q.value.trim());if(!c.hidden)count++});empty.hidden=count>0}
document.querySelectorAll('.days button').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.days button').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('.timeline').hidden=!!i;day2.hidden=!i});
function popup(title,body){modal.querySelector('h3').textContent=title;modal.querySelector('p').textContent=body;modal.showModal()}
document.querySelectorAll('[data-title]').forEach(b=>b.onclick=e=>{e.preventDefault();const title=b.dataset.title;if(title==='홈'){location.hash='home';return}popup(title,b.dataset.info||({'내 티켓':'공산성 입장권','게시판':'공산성에서 만나요','나의여행':'친구들과 공주 · 부산 주말여행'}[title])||'이 기능은 시안 미리보기입니다.')});
reply.onsubmit=e=>{e.preventDefault();if(!msg.value.trim())return;const p=document.createElement('p');p.textContent='나 · '+msg.value.trim();messages.append(p);reply.reset()};
const summary='친구들과 공주 · 12월 5일 15:00 · 공산성 산책 · 성곽길 걷기';
share.onclick=async()=>{try{if(navigator.share)await navigator.share({text:summary});else{await navigator.clipboard.writeText(summary);popup('공유','일정 내용을 복사했어요.')}}catch(e){if(e.name!=='AbortError')popup('공유',summary)}};
